name: Test fake credentials API failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Structurally valid SA JSON but with fake/invalid key material
          # The action will parse this successfully but fail when calling the YC API
          yc-sa-json-credentials: |
            {
              "id": "fake-key-id",
              "created_at": "2023-01-01T00:00:00Z",
              "key_algorithm": "RSA_2048",
              "service_account_id": "fake-service-account-id",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFPpF9y9KKZP0gSMBMGN\nfake-key-data-that-will-cause-auth-failure\n-----END RSA PRIVATE KEY-----\n",
              "public_key": "-----BEGIN PUBLIC KEY-----\nfake-public-key\n-----END PUBLIC KEY-----\n"
            }
          secret-id: 'fake-secret-id-12345'

      - name: Assert action failed due to API/auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using fake credentials against YC API"
