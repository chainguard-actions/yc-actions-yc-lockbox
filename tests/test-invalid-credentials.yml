name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action fails with invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          yc-sa-json-credentials: '{"id":"invalid-key-id","service_account_id":"invalid-sa-id","created_at":"2023-01-01T00:00:00Z","key_algorithm":"RSA_2048","public_key":"-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0000000000000000000\n-----END PUBLIC KEY-----\n","private_key":"-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC0000000000\n-----END PRIVATE KEY-----\n"}'
          secret-id: 'invalid-secret-id'

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
